<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>India Cyber Map — Hashtag Suraksha</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#007aff',
          },
          animation: {
            'ping': 'ping 1.8s cubic-bezier(0, 0, 0.2, 1) infinite',
            'pulse-slow': 'pulse 3s ease-in-out infinite',
            'spin-slow': 'spin 12s linear infinite',
          }
        }
      }
    }
  </script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #101415;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      padding: 32px 16px;
    }

    /* ── SVG glow pulse on city rings ── */
    @keyframes radarPing {
      0%   { r: 6; opacity: 0.85; }
      60%  { r: 20; opacity: 0.2; }
      100% { r: 26; opacity: 0; }
    }

    @keyframes radarPing2 {
      0%   { r: 6; opacity: 0.5; }
      60%  { r: 32; opacity: 0.08; }
      100% { r: 38; opacity: 0; }
    }

    @keyframes scanLine {
      0%   { transform: translateY(-100%); opacity: 0; }
      10%  { opacity: 0.06; }
      90%  { opacity: 0.06; }
      100% { transform: translateY(100%); opacity: 0; }
    }

    @keyframes gridPulse {
      0%, 100% { opacity: 0.04; }
      50%       { opacity: 0.08; }
    }

    @keyframes badgePulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(0, 122, 255, 0.4); }
      50%       { box-shadow: 0 0 0 6px rgba(0, 122, 255, 0); }
    }

    @keyframes dotBlink {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.3; }
    }

    /* Ping circles — SVG animated */
    .cp-1 { animation: radarPing 2.2s ease-out infinite; animation-delay: 0s; }
    .cp-2 { animation: radarPing 2.2s ease-out infinite; animation-delay: 0.7s; }
    .cp-3 { animation: radarPing 2.2s ease-out infinite; animation-delay: 1.4s; }
    .cp-4 { animation: radarPing 2.2s ease-out infinite; animation-delay: 2.1s; }
    .cp-5 { animation: radarPing 2.2s ease-out infinite; animation-delay: 0.35s; }

    .cp2-1 { animation: radarPing2 2.8s ease-out infinite; animation-delay: 0.4s; }
    .cp2-2 { animation: radarPing2 2.8s ease-out infinite; animation-delay: 1.1s; }
    .cp2-3 { animation: radarPing2 2.8s ease-out infinite; animation-delay: 1.8s; }
    .cp2-4 { animation: radarPing2 2.8s ease-out infinite; animation-delay: 2.5s; }
    .cp2-5 { animation: radarPing2 2.8s ease-out infinite; animation-delay: 0.75s; }

    /* Scan line overlay */
    .scan-line {
      position: absolute;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      border-radius: 20px;
    }
    .scan-line::after {
      content: '';
      position: absolute;
      left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, rgba(0,122,255,0.18), transparent);
      animation: scanLine 5s linear infinite;
    }

    /* Coordinate grid */
    .coord-grid {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(0,122,255,0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,122,255,0.05) 1px, transparent 1px);
      background-size: 40px 40px;
      animation: gridPulse 4s ease-in-out infinite;
      pointer-events: none;
      border-radius: 20px;
    }

    /* City tooltip */
    .city-label {
      position: absolute;
      background: rgba(16,20,21,0.85);
      border: 1px solid rgba(0,122,255,0.35);
      backdrop-filter: blur(8px);
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: rgba(0,122,255,0.9);
      pointer-events: none;
      white-space: nowrap;
      transform: translateX(-50%);
    }

    /* Badge */
    .live-badge {
      background: rgba(16,20,21,0.6);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border: 1px solid rgba(0,122,255,0.22);
      animation: badgePulse 3s ease-in-out infinite;
    }

    .live-dot {
      animation: dotBlink 1.5s ease-in-out infinite;
    }

    /* Corner brackets */
    .bracket-tl,
    .bracket-tr,
    .bracket-bl,
    .bracket-br {
      position: absolute;
      width: 20px;
      height: 20px;
      pointer-events: none;
    }
    .bracket-tl { top: 12px; left: 12px;  border-top: 1.5px solid rgba(0,122,255,0.4); border-left: 1.5px solid rgba(0,122,255,0.4); }
    .bracket-tr { top: 12px; right: 12px; border-top: 1.5px solid rgba(0,122,255,0.4); border-right: 1.5px solid rgba(0,122,255,0.4); }
    .bracket-bl { bottom: 12px; left: 12px;  border-bottom: 1.5px solid rgba(0,122,255,0.4); border-left: 1.5px solid rgba(0,122,255,0.4); }
    .bracket-br { bottom: 12px; right: 12px; border-bottom: 1.5px solid rgba(0,122,255,0.4); border-right: 1.5px solid rgba(0,122,255,0.4); }

    /* Stat pills */
    .stat-pill {
      background: rgba(16,20,21,0.7);
      border: 1px solid rgba(0,122,255,0.18);
      backdrop-filter: blur(12px);
    }

    /* Hover city tooltip fade */
    .city-group { cursor: default; }
    .city-group .city-tt {
      opacity: 0;
      transition: opacity 0.2s;
    }
    .city-group:hover .city-tt {
      opacity: 1;
    }

    /* Rotating orbit ring */
    @keyframes orbitSpin {
      from { transform: rotate(0deg) translateX(-50%) translateY(-50%); }
      to   { transform: rotate(360deg) translateX(-50%) translateY(-50%); }
    }

    .hero-map-card {
      position: relative;
      width: 100%;
      max-width: 580px;
      aspect-ratio: 560 / 680;
      background: linear-gradient(135deg, rgba(16,20,21,1) 0%, rgba(20,26,30,1) 100%);
      border: 1px solid rgba(0,122,255,0.18);
      border-radius: 20px;
      overflow: hidden;
    }
  </style>
</head>

  <!-- ── Live Status Badge ── -->

  ">
    <div class="live-badge" style="
      display:flex; align-items:center; gap:10px;
      padding:8px 18px;
      border-radius:999px;
    ">
      <!-- Ping dot -->
      <span style="position:relative; display:flex; width:10px; height:10px; flex-shrink:0;">
        <span class="live-dot" style="
          position:relative; display:inline-flex;
          width:10px; height:10px;
          border-radius:50%;
          background:#007aff;
        "></span>
        <!-- Outer ping ring -->
        <span style="
          position:absolute;
          inset:-3px;
          border-radius:50%;
          border:1.5px solid rgba(0,122,255,0.5);
          animation:radarPing 2s ease-out infinite;
        "></span>
      </span>
      <span style="font-size:11px; font-weight:700; letter-spacing:0.06em; color:rgba(255,255,255,0.88);">
        LIVE: <span id="liveBadgeText" style="color:rgba(0,122,255,0.9);">National Cyber Awareness Drive Active</span>
      </span>
    </div>
  </div>

  <!-- ── Stats row ── -->
  <div style="
    position:absolute;
    top:38px; left:12px; right:12px;
    display:flex; gap:6px;
    z-index:10;
  ">
    <div class="stat-pill" style="padding:5px 10px; border-radius:8px; flex:1; text-align:center;">
      <div style="font-size:14px; font-weight:800; color:rgba(0,122,255,0.9); letter-spacing:-0.01em;">28+</div>
      <div style="font-size:7px; font-weight:700; letter-spacing:0.09em; text-transform:uppercase; color:rgba(255,255,255,0.35); margin-top:1px;">States Active</div>

    <div class="stat-pill" style="padding:5px 10px; border-radius:8px; flex:1; text-align:center;">
      <div style="font-size:14px; font-weight:800; color:rgba(0,122,255,0.9); letter-spacing:-0.01em;">5</div>
      <div style="font-size:7px; font-weight:700; letter-spacing:0.09em; text-transform:uppercase; color:rgba(255,255,255,0.35); margin-top:1px;">Major Hubs</div>
    </div>
    <div class="stat-pill" style="padding:5px 10px; border-radius:8px; flex:1; text-align:center;">
      <div style="font-size:14px; font-weight:800; color:rgba(0,122,255,0.9); letter-spacing:-0.01em;">1,200+</div>
      <div style="font-size:7px; font-weight:700; letter-spacing:0.09em; text-transform:uppercase; color:rgba(255,255,255,0.35); margin-top:1px;">Schools</div>
    </div>
    <div class="stat-pill" style="padding:5px 10px; border-radius:8px; flex:1; text-align:center;">

  </div>

</div><!-- end hero-map-card -->

<script>
  // ── Live clock in HUD bar ──
  function updateTime() {
    const now = new Date();
    const h = String(now.getHours()).padStart(2,'0');
    const m = String(now.getMinutes()).padStart(2,'0');
    const s = String(now.getSeconds()).padStart(2,'0');
    const el = document.getElementById('liveTime');
    if (el) el.textContent = h + ':' + m + ':' + s;
  }
  updateTime();
  setInterval(updateTime, 1000);

  // ── Rotating live badge messages ──
  const messages = [
    'National Cyber Awareness Drive Active',
    'Training Session · Mumbai Hub',
    'Live Workshop · New Delhi',
    'CASK Session · Bangalore Schools',
    'Alert Monitor · Kolkata Node',
    'Awareness Campaign · Hyderabad',
  ];
  let msgIdx = 0;
  const badgeEl = document.getElementById('liveBadgeText');
  setInterval(function() {
    msgIdx = (msgIdx + 1) % messages.length;
    if (badgeEl) {
      badgeEl.style.opacity = '0';
      badgeEl.style.transition = 'opacity 0.4s';
      setTimeout(function() {
        badgeEl.textContent = messages[msgIdx];
        badgeEl.style.opacity = '1';
      }, 400);
    }
  }, 4000);
</script>
